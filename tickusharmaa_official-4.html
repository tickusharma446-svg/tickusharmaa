<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0b0b0f">
<title>Tickusharmaa | Official</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:#fff;background:#07070a;overflow-x:hidden}
body:before,body:after{content:"";position:fixed;width:320px;height:320px;border-radius:50%;filter:blur(90px);opacity:.22;z-index:-1}
body:before{background:#6c5ce7;top:-100px;left:-100px}
body:after{background:#00c2ff;right:-120px;bottom:-100px}
.wrap{max-width:720px;margin:auto;padding:28px 18px 35px}
.card{background:rgba(18,18,24,.78);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(18px);border-radius:30px;padding:34px 20px 25px;text-align:center;box-shadow:0 25px 80px rgba(0,0,0,.45)}
.avatar{width:104px;height:104px;margin:auto;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#fff,#bfc4cc);color:#101014;font-size:30px;font-weight:900;letter-spacing:-2px;border:4px solid rgba(255,255,255,.85);box-shadow:0 0 35px rgba(255,255,255,.12)}
h1{font-size:32px;margin:17px 0 7px;letter-spacing:1px}
.handle{color:#aaa;font-size:14px;margin-bottom:12px}
.bio{color:#d0d0d5;font-size:15px;line-height:1.55;margin:0 auto 25px;max-width:520px}
.badge{display:inline-block;padding:7px 13px;border:1px solid #333;border-radius:999px;color:#ddd;font-size:12px;margin-bottom:18px}
.links{display:grid;gap:13px}
a.btn{min-height:61px;border-radius:17px;text-decoration:none;color:white;display:flex;align-items:center;padding:0 20px;font-weight:700;font-size:17px;transition:.2s;box-shadow:0 8px 25px rgba(0,0,0,.22)}
a.btn:hover{transform:translateY(-3px);filter:brightness(1.08)}
.icon{width:32px;font-size:22px;text-align:center;margin-right:12px}
.youtube{background:linear-gradient(100deg,#e50914,#ff3b30)}
.instagram{background:linear-gradient(100deg,#833ab4,#fd1d1d,#fcb045)}
.facebook{background:linear-gradient(100deg,#1877f2,#4267b2)}
.more{margin-top:22px;color:#777;font-size:12px}
footer{margin-top:18px;color:#555;font-size:11px}
</style>
</head>
<body>
<div class="wrap">
  <section class="card">
    <div class="avatar">TS</div>
    <div class="badge">OFFICIAL CREATOR PAGE</div>
    <h1>TICKUSHARMAA</h1>
    <div class="handle">@tickusharmaa</div>
    <p class="bio">Village • Vlogs • Gaming<br>Follow my journey and join the family ❤️</p>

    <div class="links">
      <a class="btn youtube" href="https://youtube.com/@tickusharmaa?si=iSA1JC7KqPZseevW" target="_blank" rel="noopener noreferrer">
        <span class="icon">▶</span><span>YouTube</span>
      </a>
      <a class="btn instagram" href="https://www.instagram.com/tickusharmaa?stkn=MXE3OGVnZGtnZjRyYQ==" target="_blank" rel="noopener noreferrer">
        <span class="icon">◎</span><span>Instagram</span>
      </a>
      <a class="btn facebook" href="https://www.facebook.com/share/19JrQgALe3/" target="_blank" rel="noopener noreferrer">
        <span class="icon">f</span><span>Facebook</span>
      </a>
    </div>

    <div class="more">Thanks for supporting TICKUSHARMAA ❤️</div>
    <footer>© 2026 Tickusharmaa • All rights reserved</footer>
  </section>
</div>
</body>
</html>
